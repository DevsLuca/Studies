name: Update progress
on:
  push:
    paths: ["LeetCode/README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeetCode
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_progress.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update progress table"
          git push
